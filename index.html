<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C6A58">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Note">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Taccuino offline</title>



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#1B2925; --muted:#5E6E68; --line:#D6DFDA;
  --accent:#2C6A58; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5; --danger:#B3413A;
  --hl-giallo:#F7E27C; --hl-rosa:#F4BCCB; --hl-azzurro:#BCDAF3; --hl-verde:#C3E6BF;
  --hl-ink:#1B2925;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121A18; --surface:#1A2421; --ink:#E4ECE8; --muted:#94A59E; --line:#2D3A36;
    --accent:#6FC2A6; --accent-ink:#0E1614; --accent-soft:#1F3a32; --danger:#E0736B;
    --hl-giallo:#8C7A1E; --hl-rosa:#8A4459; --hl-azzurro:#35607F; --hl-verde:#3F6B3B;
    --hl-ink:#F4F7F5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121A18; --surface:#1A2421; --ink:#E4ECE8; --muted:#94A59E; --line:#2D3A36;
  --accent:#6FC2A6; --accent-ink:#0E1614; --accent-soft:#1F3a32; --danger:#E0736B;
  --hl-giallo:#8C7A1E; --hl-rosa:#8A4459; --hl-azzurro:#35607F; --hl-verde:#3F6B3B;
  --hl-ink:#F4F7F5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 clamp(2rem,6vw,2.8rem)/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.count{font:500 .85rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--accent);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

form.add{display:grid;grid-template-columns:1fr minmax(120px,180px) auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
@media (max-width:560px){form.add{grid-template-columns:1fr auto}form.add #newList{grid-column:1/2;grid-row:2}}
input,textarea,select{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 10px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
#newList{border-color:var(--line);font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 16px}
button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:99px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.group{display:flex;flex-direction:column;gap:6px}
.group h2{font:700 .78rem var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 0 2px;display:flex;justify-content:space-between}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.task input[type=checkbox]{appearance:none;width:22px;height:22px;margin:2px 0 0;border:2px solid var(--muted);border-radius:6px;cursor:pointer;display:grid;place-content:center;padding:0}
.task input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.task input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.text{padding-top:1px;word-break:break-word}
.text span{padding:1px 3px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.task.done .text span{text-decoration:line-through;color:var(--muted)}
.task[data-color] .text span{color:var(--hl-ink)}
.task[data-color="giallo"] .text span{background:var(--hl-giallo)}
.task[data-color="rosa"] .text span{background:var(--hl-rosa)}
.task[data-color="azzurro"] .text span{background:var(--hl-azzurro)}
.task[data-color="verde"] .text span{background:var(--hl-verde)}
.tools{display:flex;gap:2px;align-items:center}
.ic{background:transparent;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:7px;position:relative}
.ic:hover{background:var(--bg);color:var(--ink)}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.has{color:var(--accent)}
.ic.has::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.panel{grid-column:2/4;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw.none{background:var(--surface);position:relative}
.sw.none::after{content:"";position:absolute;inset:10px 3px;border-top:2px solid var(--muted);transform:rotate(-45deg)}
.note{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);background:var(--bg);font-size:.95rem}
.notePreview{grid-column:2/4;color:var(--muted);font-size:.9rem;white-space:pre-wrap;border-left:2px solid var(--accent-soft);padding-left:10px;margin-top:2px}
.meta{font:400 .74rem var(--mono);color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;font-size:.9rem}
.danger{background:var(--danger);color:#fff;padding:5px 12px}
.ghost{background:transparent;color:var(--muted);padding:5px 10px;border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.status{font:.78rem var(--mono);color:var(--muted);min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<!-- Inserimneto data -->
<span id="data-oggi"></span>
<script>
  const oggi = new Date();
  // Formattazione  (es. DD/MM/YYYY)
  const giorno = String(oggi.getDate()).padStart(2, '0');
  const mese = String(oggi.getMonth() + 1).padStart(2, '0');
  const anno = oggi.getFullYear();
  
  document.getElementById('data-oggi').textContent = `${giorno}/${mese}/${anno}`;
</script>   
<div class="wrap">
  <header>
    <div>
      <h1>Note</h1>
      <p class="sub">Offline, cookies session storage</p>
    </div>
    <div class="count" id="count"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newText" placeholder="Nuova attività…" aria-label="Nuova attività" required>
    <input id="newList" list="lists" placeholder="Lista" aria-label="Lista">
    <datalist id="lists"></datalist>
    <button class="primary" type="submit">Aggiungi</button>
  </form>

  <div class="filters" id="filters" role="group" aria-label="Filtra">
    <button class="chip" data-f="todo" aria-pressed="true">Da fare</button>
    <button class="chip" data-f="all" aria-pressed="false">Tutte</button>
    <button class="chip" data-f="hl" aria-pressed="false">Evidenziate</button>
    <button class="chip" data-f="done" aria-pressed="false">Fatte</button>
  </div>

  <div id="list"></div>
  <div class="status" id="status"></div>
</div>

<script>
const COLORS=["giallo","rosa","azzurro","verde"];
const I={
  hl:'<svg viewBox="0 0 24 24"><path d="M9 11l-5 5v4h4l5-5"/><path d="M13 7l4 4"/><path d="M15 5l4 4-6 6-4-4z"/></svg>',
  note:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
};
let tasks=[]; let filter="todo"; let open={}; let confirmDel=null; let db=null;
try{filter=localStorage.getItem("f")||"todo"}catch(e){}

const $=s=>document.querySelector(s);
const setStatus=t=>{$("#status").textContent=t||""};

// storage layer: db if available, else local fallback
const local={
  load(){try{return JSON.parse(localStorage.getItem("tasks")||"[]")}catch(e){return []}},
  save(){try{localStorage.setItem("tasks",JSON.stringify(tasks))}catch(e){}}
};
const pending={};
async function write(id,data){
  const t=tasks.find(x=>x.id===id); if(t) Object.assign(t,data);
  render();
  if(!db){local.save();return}
  const prev=pending[id]||Promise.resolve();
  pending[id]=prev.then(()=>db.doc("tasks/"+id).update(data)).catch(e=>setStatus("Salvataggio non riuscito: "+(e&&e.message||"riprova")));
}
async function create(data){
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const t={id,...data};
  if(!db){tasks.push(t);local.save();render();return}
  try{await db.doc("tasks/"+id).set(data)}catch(e){setStatus(e&&e.code==="quota_exceeded"?"Troppe attività salvate: eliminane qualcuna.":"Non sono riuscita a salvare. Riprova.")}
}
async function remove(id){
  tasks=tasks.filter(x=>x.id!==id); confirmDel=null; render();
  if(!db){local.save();return}
  try{await db.doc("tasks/"+id).delete()}catch(e){setStatus("Eliminazione non riuscita.")}
}

function el(tag,attrs={},kids=[]){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="text")n.textContent=v;else if(k==="html")n.innerHTML=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v)}for(const c of kids)if(c)n.append(c);return n}

function render(){
  const done=tasks.filter(t=>t.done).length;
  $("#count").innerHTML="<b>"+done+"</b> / "+tasks.length+" fatte";
  $("#progress").style.width=tasks.length?(done/tasks.length*100)+"%":"0";
  document.querySelectorAll("#filters .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter));
  const lists=[...new Set(tasks.map(t=>t.list||"Generale"))];
  $("#lists").replaceChildren(...lists.map(l=>el("option",{value:l})));

  let shown=tasks.filter(t=>filter==="all"||(filter==="todo"&&!t.done)||(filter==="done"&&t.done)||(filter==="hl"&&t.color));
  shown.sort((a,b)=>(a.created||0)-(b.created||0));
  const box=$("#list");
  // keep focus in note textarea across rerenders
  const act=document.activeElement; const keep=act&&act.dataset&&act.dataset.note?{id:act.dataset.note,s:act.selectionStart,e:act.selectionEnd}:null;
  if(!shown.length){box.replaceChildren(el("p",{class:"empty",text:tasks.length?"Niente qui. Prova un altro filtro.":"Nessuna attività. Aggiungine una qui sopra."}));return}
  const groups={}; shown.forEach(t=>{(groups[t.list||"Generale"]??=[]).push(t)});
  box.replaceChildren(...Object.entries(groups).map(([name,items])=>{
    const tot=tasks.filter(t=>(t.list||"Generale")===name); const d=tot.filter(t=>t.done).length;
    return el("section",{class:"group"},[
      el("h2",{},[el("span",{text:name}),el("span",{text:d+"/"+tot.length})]),
      el("ul",{},items.map(item))
    ]);
  }));
  if(keep){const ta=document.querySelector('[data-note="'+keep.id+'"]');if(ta){ta.focus();ta.setSelectionRange(keep.s,keep.e)}}
}

function item(t){
  const o=open[t.id];
  const li=el("li",{class:"task"+(t.done?" done":""),"data-color":t.color||false});
  const cb=el("input",{type:"checkbox",id:"cb-"+t.id,"aria-label":"Fatta",onchange:e=>write(t.id,{done:e.target.checked,doneAt:e.target.checked?Date.now():null})});
  cb.checked=!!t.done;
  const txt=el("label",{class:"text",for:"cb-"+t.id},[el("span",{text:t.text})]);
  const tools=el("div",{class:"tools"},[
    el("button",{class:"ic"+(t.color?" has":""),type:"button",title:"Evidenzia","aria-label":"Evidenzia",html:I.hl,onclick:()=>{open[t.id]=o==="hl"?null:"hl";render()}}),
    el("button",{class:"ic"+(t.note?" has":""),type:"button",title:"Commento","aria-label":"Commento",html:I.note,onclick:()=>{open[t.id]=o==="note"?null:"note";render();setTimeout(()=>{const a=document.querySelector('[data-note="'+t.id+'"]');a&&a.focus()},0)}}),
    el("button",{class:"ic",type:"button",title:"Elimina","aria-label":"Elimina",html:I.del,onclick:()=>{confirmDel=confirmDel===t.id?null:t.id;render()}})
  ]);
  li.append(cb,txt,tools);
  if(confirmDel===t.id){
    li.append(el("div",{class:"panel"},[el("div",{class:"confirm"},[el("span",{text:"Eliminare questa attività?"}),el("button",{class:"danger",type:"button",text:"Elimina",onclick:()=>remove(t.id)}),el("button",{class:"ghost",type:"button",text:"Annulla",onclick:()=>{confirmDel=null;render()}})])]));
  }
  if(o==="hl"){
    li.append(el("div",{class:"panel"},[el("div",{class:"swatches",role:"group","aria-label":"Colore evidenziatore"},[
      el("button",{class:"sw none",type:"button","aria-label":"Nessuno","aria-pressed":!t.color,onclick:()=>write(t.id,{color:null})}),
      ...COLORS.map(c=>el("button",{class:"sw",type:"button",style:"background:var(--hl-"+c+")","aria-label":c,"aria-pressed":t.color===c,onclick:()=>write(t.id,{color:c})}))
    ])]));
  }
  if(o==="note"){
    let timer;
    const ta=el("textarea",{class:"note","data-note":t.id,id:"note-"+t.id,placeholder:"Scrivi un commento…","aria-label":"Commento"});
    ta.value=t.note||"";
    const save=()=>{clearTimeout(timer);if((t.note||"")!==ta.value)write(t.id,{note:ta.value})};
    ta.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(save,900)});
    ta.addEventListener("blur",save);
    li.append(el("div",{class:"panel"},[ta]));
  } else if(t.note){
    li.append(el("div",{class:"notePreview",text:t.note}));
  }
  if(t.done&&t.doneAt){li.append(el("div",{class:"meta",style:"grid-column:2/4",text:"Fatta il "+new Date(t.doneAt).toLocaleDateString("it-IT",{day:"numeric",month:"short"})}))}
  return li;
}

$("#addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const text=$("#newText").value.trim(); if(!text)return;
  const list=$("#newList").value.trim()||"Generale";
  create({text,list,done:false,color:null,note:"",created:Date.now()});
  $("#newText").value=""; $("#newText").focus();
  if(filter==="done"||filter==="hl"){filter="todo"}
});
$("#filters").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;try{localStorage.setItem("f",filter)}catch(e){}render()});

tasks=local.load(); render();

(async()=>{
  db=null;
  if(!db){return}
  db.collection("tasks").onSnapshot(s=>{
    tasks=s.docs.map(d=>({id:d.id,...d.data()}));
    render(); setStatus("");
  },e=>setStatus("Sincronizzazione interrotta: ricarica la pagina."));
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(err => console.log("Service Worker non registrato:", err));
  });
}

</script>
</body></html>
